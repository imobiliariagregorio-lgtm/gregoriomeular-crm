<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — CRM Gregório | Meu Lar</title>
<script>try{var t=localStorage.getItem('crm-tema');if(t==='claro'||t==='escuro')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="apple-touch-icon" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-screen" id="resetScreen">
  <form class="login-card" id="resetForm">
    <div class="login-logo">
      <img src="assets/logo-icon.png" alt="Gregório | Meu Lar" class="logo-mark-img">
      <span class="logo-text">Gregório <strong>| Meu Lar</strong></span>
    </div>
    <p class="login-sub" id="resetSub">Verificando o link de redefinição...</p>
    <div class="form-row">
      <label for="reset-senha">Nova senha</label>
      <input required type="password" id="reset-senha" placeholder="Mínimo 6 caracteres" minlength="6" disabled>
    </div>
    <div class="form-row">
      <label for="reset-senha-confirma">Confirmar nova senha</label>
      <input required type="password" id="reset-senha-confirma" placeholder="Digite de novo" minlength="6" disabled>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="resetBtn" disabled>Verificando link...</button>
    <p class="login-error" id="resetError" hidden></p>
    <p class="login-feedback" id="resetFeedback" hidden></p>
    <a href="/" class="link-btn" id="backToLoginLink" style="display:block; text-align:center; text-decoration:none;">Voltar para o login</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(function () {
  const sub = document.getElementById('resetSub');
  const senhaInput = document.getElementById('reset-senha');
  const confirmaInput = document.getElementById('reset-senha-confirma');
  const btn = document.getElementById('resetBtn');
  const erroEl = document.getElementById('resetError');
  const feedbackEl = document.getElementById('resetFeedback');
  const form = document.getElementById('resetForm');

  function mostrarErro(msg) {
    erroEl.textContent = msg;
    erroEl.hidden = false;
    feedbackEl.hidden = true;
  }

  function liberarFormulario() {
    sub.textContent = 'Digite sua nova senha de acesso ao CRM.';
    senhaInput.disabled = false;
    confirmaInput.disabled = false;
    btn.disabled = false;
    btn.textContent = 'Salvar nova senha';
  }

  // O cliente Supabase detecta sozinho o token de recuperação que vem no
  // #hash da URL (enviado por e-mail) assim que a página carrega, e dispara
  // o evento PASSWORD_RECOVERY. Só liberamos o formulário quando isso
  // acontecer — evita mostrar o formulário pra quem abriu a página direto,
  // sem vir de um link de e-mail válido.
  let liberado = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY' && !liberado) {
      liberado = true;
      liberarFormulario();
    }
  });

  // Se depois de alguns segundos o evento não disparou, o link provavelmente
  // é inválido, expirado, ou a página foi aberta sem vir do e-mail.
  setTimeout(() => {
    if (!liberado) {
      sub.textContent = 'Não foi possível validar o link de redefinição.';
      mostrarErro('Esse link expirou ou já foi usado. Peça um novo em "Esqueci minha senha" na tela de login.');
      btn.textContent = 'Link inválido';
    }
  }, 4000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.hidden = true;
    feedbackEl.hidden = true;

    const senha = senhaInput.value;
    const confirma = confirmaInput.value;
    if (senha.length < 6) { mostrarErro('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if (senha !== confirma) { mostrarErro('As duas senhas digitadas não são iguais.'); return; }

    btn.disabled = true;
    btn.textContent = 'Salvando...';

    const { error } = await supabase.auth.updateUser({ password: senha });

    if (error) {
      mostrarErro('Não foi possível salvar a nova senha: ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Salvar nova senha';
      return;
    }

    senhaInput.disabled = true;
    confirmaInput.disabled = true;
    btn.hidden = true;
    feedbackEl.textContent = 'Senha alterada com sucesso! Redirecionando para o login...';
    feedbackEl.hidden = false;
    await supabase.auth.signOut();
    setTimeout(() => { window.location.href = '/'; }, 2500);
  });
})();
</script>

</body>
</html>
